name: MYT Machine Settlement and Identity

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / cryptography ${{ matrix.cryptography }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
        cryptography: [floor, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependency floor
        if: matrix.cryptography == 'floor'
        run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - name: Install package against dependency floor
        if: matrix.cryptography == 'floor'
        run: python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Install package with latest compatible dependencies
        if: matrix.cryptography == 'latest'
        run: python -m pip install --disable-pip-version-check --upgrade -e .
      - name: Verify dependency floor
        if: matrix.cryptography == 'floor'
        run: python -c "import cryptography; assert cryptography.__version__ == '50.0.0', cryptography.__version__"
      - name: Dependency versions and consistency
        run: |
          python -c "import cryptography, myt_machine; print('cryptography=' + cryptography.__version__); print('myt_machine=' + myt_machine.__version__)"
          python -m pip check
      - name: Unit and CLI tests
        run: python -m unittest discover -s tests -v
      - name: Compile modules
        run: python -m compileall -q src tests

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and pip-audit
        run: python -m pip install --disable-pip-version-check -e . pip-audit
      - name: Audit installed dependencies
        run: python -m pip_audit

  package:
    name: Build and smoke-test wheel and source distribution
    runs-on: ubuntu-latest
    needs: [test, audit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check build
      - name: Build distributions
        run: python -m build . --outdir dist
      - name: Verify wheel metadata
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob('dist/*.whl')
          assert len(wheel) == 1, wheel
          assert wheel[0].endswith('myt_machine_settlement-0.2.0-py3-none-any.whl'), wheel
          with zipfile.ZipFile(wheel[0]) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith('/METADATA'))
              metadata = archive.read(metadata_name).decode('utf-8')
          requirements = [line for line in metadata.splitlines() if line.startswith('Requires-Dist:')]
          assert requirements == ['Requires-Dist: cryptography>=50.0.0'], requirements
          assert '<50' not in metadata
          PY
      - name: Verify source distribution documentation
        run: |
          tar -tzf dist/myt_machine_settlement-0.2.0.tar.gz | grep '/docs/identity-v1.md$'
          tar -tzf dist/myt_machine_settlement-0.2.0.tar.gz | grep '/docs/identity-v1-test-vector.json$'
      - name: Smoke-test installed wheel
        run: |
          python -m venv /tmp/myt-machine-wheel
          /tmp/myt-machine-wheel/bin/python -m pip install --disable-pip-version-check dist/*.whl
          test "$(/tmp/myt-machine-wheel/bin/python -c 'import myt_machine; print(myt_machine.__version__)')" = "0.2.0"

          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' 'phase4b-wheel-smoke-passphrase' > "$work/passphrase"
          chmod 600 "$work/passphrase"

          MYT_WALLET_RPC_URL=ftp://invalid.example \
            /tmp/myt-machine-wheel/bin/myt-machine identity create \
              --private-key-file "$work/key.pem" \
              --identity-file "$work/identity.json" \
              --passphrase-file "$work/passphrase" > "$work/create.json"

          signature=$(/tmp/myt-machine-wheel/bin/myt-machine identity sign \
            --private-key-file "$work/key.pem" \
            --identity-file "$work/identity.json" \
            --passphrase-file "$work/passphrase" \
            --context myt-machine/ci \
            --message offline-smoke | \
            /tmp/myt-machine-wheel/bin/python -c 'import json,sys; print(json.load(sys.stdin)["signature"])')

          /tmp/myt-machine-wheel/bin/myt-machine identity verify \
            --identity-file "$work/identity.json" \
            --context myt-machine/ci \
            --message offline-smoke \
            --signature "$signature" > "$work/verify.json"

          set +e
          /tmp/myt-machine-wheel/bin/myt-machine \
            --rpc-url ftp://127.0.0.1 status > "$work/settlement-smoke.json"
          code=$?
          set -e
          test "$code" -eq 3

          /tmp/myt-machine-wheel/bin/python - <<PY
          import json
          from pathlib import Path

          root = Path('$work')
          create = json.loads((root / 'create.json').read_text())
          verify = json.loads((root / 'verify.json').read_text())
          settlement = json.loads((root / 'settlement-smoke.json').read_text())
          assert create['command'] == 'identity-create' and create['success'] is True
          assert verify['command'] == 'identity-verify' and verify['valid'] is True
          assert settlement['command'] == 'status' and settlement['success'] is False
          assert settlement['error']['code'] == 'invalid_configuration'
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: myt-machine-settlement-v0.2.0
          path: dist/*
          if-no-files-found: error
