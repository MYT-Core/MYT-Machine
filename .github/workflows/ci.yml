name: MYT Machine Settlement, Identity, Binding, Billing, and Reputation

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / cryptography ${{ matrix.cryptography }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
        cryptography: [floor, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Update installation tooling
        run: python -m pip install --disable-pip-version-check --upgrade pip
      - name: Install dependency floor
        if: matrix.cryptography == 'floor'
        run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - name: Install package against dependency floor
        if: matrix.cryptography == 'floor'
        run: python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Install package with latest compatible dependencies
        if: matrix.cryptography == 'latest'
        run: python -m pip install --disable-pip-version-check --upgrade -e .
      - name: Verify dependency floor
        if: matrix.cryptography == 'floor'
        run: python -c "import cryptography; assert cryptography.__version__ == '50.0.0', cryptography.__version__"
      - name: Dependency versions and consistency
        run: |
          python -c "import cryptography, myt_machine; print('cryptography=' + cryptography.__version__); print('myt_machine=' + myt_machine.__version__)"
          python -m pip check
      - name: Unit and CLI tests
        run: python -m unittest discover -s tests -v
      - name: Separate legacy regression gates
        run: |
          python -m unittest discover -s tests -p "test_amounts.py"
          python -m unittest discover -s tests -p "test_settlement.py"
          python -m unittest discover -s tests -p "test_rpc.py"
          python -m unittest discover -s tests -p "test_proofs.py"
          python -m unittest discover -s tests -p "test_cli.py"
          python -m unittest discover -s tests -p "test_identity*.py"
          python -m unittest discover -s tests -p "test_cli_identity.py"
          python -m unittest discover -s tests -p "test_binding*.py"
          python -m unittest discover -s tests -p "test_cli_binding.py"
          python -m unittest discover -s tests -p "test_payment_requests.py"
          python -m unittest discover -s tests -p "test_invoice*.py"
          python -m unittest discover -s tests -p "test_billing_http.py"
          python -m unittest discover -s tests -p "test_cli_billing.py"
          python -m unittest discover -s tests -p "test_reputation*.py"
          python -m unittest discover -s tests -p "test_cli_reputation.py"
      - name: Compile modules
        run: python -m compileall -q src tests

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Update installation tooling
        run: python -m pip install --disable-pip-version-check --upgrade pip
      - name: Install package and security tooling
        run: python -m pip install --disable-pip-version-check -e . pip-audit bandit ruff
      - name: Audit installed dependencies
        run: python -m pip_audit
      - name: Static checks
        run: |
          ruff check src tests
          bandit -q -r src/myt_machine

  package:
    name: Build and smoke-test wheel and source distribution
    runs-on: ubuntu-latest
    needs: [test, audit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Update installation tooling
        run: python -m pip install --disable-pip-version-check --upgrade pip
      - name: Install build frontends
        run: python -m pip install --disable-pip-version-check build twine
      - name: Build distributions
        run: python -m build . --outdir dist
      - name: Verify wheel metadata
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob('dist/*.whl')
          assert len(wheel) == 1, wheel
          assert wheel[0].endswith('myt_machine_settlement-0.5.0-py3-none-any.whl'), wheel
          with zipfile.ZipFile(wheel[0]) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith('/METADATA'))
              metadata = archive.read(metadata_name).decode('utf-8')
          requirements = [line for line in metadata.splitlines() if line.startswith('Requires-Dist:')]
          assert requirements == ['Requires-Dist: cryptography>=50.0.0'], requirements
          assert '<50' not in metadata
          PY
      - name: Verify source distribution documentation
        run: |
          tar -tzf dist/myt_machine_settlement-0.5.0.tar.gz | grep '/docs/identity-v1.md$'
          tar -tzf dist/myt_machine_settlement-0.5.0.tar.gz | grep '/docs/identity-v1-test-vector.json$'
          tar -tzf dist/myt_machine_settlement-0.5.0.tar.gz | grep '/docs/address-binding-v1.md$'
          tar -tzf dist/myt_machine_settlement-0.5.0.tar.gz | grep '/docs/address-binding-v1-test-vector.json$'
      - name: Verify Phase 4D source distribution documentation
        run: |
          tar -tzf dist/myt_machine_settlement-0.5.0.tar.gz | grep '/docs/payment-requests.md$'
          tar -tzf dist/myt_machine_settlement-0.5.0.tar.gz | grep '/docs/payment-request-v1-test-vector.json$'
          tar -tzf dist/myt_machine_settlement-0.5.0.tar.gz | grep '/docs/invoices.md$'
          tar -tzf dist/myt_machine_settlement-0.5.0.tar.gz | grep '/docs/api-billing.md$'
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Verify Phase 4E source distribution documentation
        run: |
          tar -tzf dist/myt_machine_settlement-0.5.0.tar.gz | grep '/docs/reputation.md$'
          tar -tzf dist/myt_machine_settlement-0.5.0.tar.gz | grep '/docs/reputation-policy.md$'
          tar -tzf dist/myt_machine_settlement-0.5.0.tar.gz | grep '/docs/reputation-attestation-v1.md$'
          tar -tzf dist/myt_machine_settlement-0.5.0.tar.gz | grep '/docs/reputation-attestation-v1-test-vector.json$'
      - name: Smoke-test installed wheel
        run: |
          python -m venv /tmp/myt-machine-wheel
          /tmp/myt-machine-wheel/bin/python -m pip install --disable-pip-version-check --upgrade pip
          /tmp/myt-machine-wheel/bin/python -m pip install --disable-pip-version-check dist/*.whl
          test "$(/tmp/myt-machine-wheel/bin/python -c 'import myt_machine; print(myt_machine.__version__)')" = "0.5.0"

          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' 'phase4b-wheel-smoke-passphrase' > "$work/passphrase"
          chmod 600 "$work/passphrase"

          MYT_WALLET_RPC_URL=ftp://invalid.example \
            /tmp/myt-machine-wheel/bin/myt-machine identity create \
              --private-key-file "$work/key.pem" \
              --identity-file "$work/identity.json" \
              --passphrase-file "$work/passphrase" > "$work/create.json"

          signature=$(/tmp/myt-machine-wheel/bin/myt-machine identity sign \
            --private-key-file "$work/key.pem" \
            --identity-file "$work/identity.json" \
            --passphrase-file "$work/passphrase" \
            --context myt-machine/ci \
            --message offline-smoke | \
            /tmp/myt-machine-wheel/bin/python -c 'import json,sys; print(json.load(sys.stdin)["signature"])')

          /tmp/myt-machine-wheel/bin/myt-machine identity verify \
            --identity-file "$work/identity.json" \
            --context myt-machine/ci \
            --message offline-smoke \
            --signature "$signature" > "$work/verify.json"

          /tmp/myt-machine-wheel/bin/python - "$work" <<'PY'
          import sys
          from pathlib import Path

          from myt_machine import (
              AddressBinding,
              MachineIdentity,
              create_binding_content,
              save_address_binding,
          )
          from myt_machine.binding import BINDING_CONTEXT

          root = Path(sys.argv[1])
          identity = MachineIdentity.generate()
          address = 'B' + 'C' * 94
          content = create_binding_content(identity.machine_id, 'testnet', address)
          signature = identity.sign(content, BINDING_CONTEXT)
          binding = AddressBinding(
              identity=identity.public_identity,
              network='testnet',
              address=address,
              identity_signature=signature.signature,
              wallet_signature='SigV2' + '1' * 88,
          )
          save_address_binding(binding, root / 'binding.json')
          PY

          MYT_WALLET_RPC_URL=ftp://invalid.example \
            /tmp/myt-machine-wheel/bin/myt-machine binding show \
              --binding-file "$work/binding.json" > "$work/binding-show.json"

          set +e
          /tmp/myt-machine-wheel/bin/myt-machine \
            --rpc-url ftp://127.0.0.1 status > "$work/settlement-smoke.json"
          code=$?
          set -e
          test "$code" -eq 3

          /tmp/myt-machine-wheel/bin/python - <<PY
          import json
          from pathlib import Path

          root = Path('$work')
          create = json.loads((root / 'create.json').read_text())
          verify = json.loads((root / 'verify.json').read_text())
          settlement = json.loads((root / 'settlement-smoke.json').read_text())
          binding_show = json.loads((root / 'binding-show.json').read_text())
          assert create['command'] == 'identity-create' and create['success'] is True
          assert verify['command'] == 'identity-verify' and verify['valid'] is True
          assert binding_show['command'] == 'binding-show'
          assert binding_show['success'] is True
          assert binding_show['binding']['network'] == 'testnet'
          assert settlement['command'] == 'status' and settlement['success'] is False
          assert settlement['error']['code'] == 'invalid_configuration'
          PY
      - name: Clean-wheel billing E2E and regression tests
        run: |
          cd /tmp
          /tmp/myt-machine-wheel/bin/python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - uses: actions/upload-artifact@v7
        with:
          name: myt-machine-settlement-v0.5.0
          path: dist/*
          if-no-files-found: error
